name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  linux-build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm zip

      - name: Build
        run: ./build.sh

  macos-build:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        run: brew install nasm

      - name: Build
        run: ./build.sh

  windows-build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        run: choco install nasm -y

      - name: Build
        run: build.bat
        shell: cmd
